name: PCB Platform CI/CD Pipeline

on:
  push:
    branches: [ main, master, 'feature/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test-backend:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: pcb_db
          MYSQL_USER: pcb_user
          MYSQL_PASSWORD: pcb_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Django Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/django/requirements.txt

      - name: Test Django Backend
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_DATABASE: pcb_db
          MYSQL_USER: pcb_user
          MYSQL_PASSWORD: pcb_password
          MYSQL_PORT: 3306
          JWT_SECRET_KEY: test-shared-jwt-secret
        run: |
          python backend/django/manage.py test

      - name: Install FastAPI Dependencies
        run: |
          pip install -r backend/fastapi-cart/requirements.txt

      - name: Verify FastAPI App Initialization
        env:
          MONGO_URI: mongodb://localhost:27017
          JWT_SECRET_KEY: test-shared-jwt-secret
        run: |
          python -c "from backend.fastapi_cart.main import app; print('FastAPI App Loaded Successfully')"

  build-frontends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Build Next.js Shop
        run: |
          cd frontend/nextjs-shop
          npm ci
          npm run build

      - name: Build React Admin Dashboard
        run: |
          cd frontend/react-admin
          npm ci
          npm run build
